<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Wolf — Weekly Content Review</title>
<script src="config.js" onerror="void 0"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f8fa; color: #1f2328; min-height: 100vh; }
  header { background: #ffffff; border-bottom: 1px solid #d0d7de; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header img { height: 36px; border-radius: 4px; }
  header h1 { font-size: 18px; font-weight: 600; color: #1f2328; }
  header span { font-size: 13px; color: #636e7b; margin-left: auto; }
  main { max-width: 860px; margin: 32px auto; padding: 0 16px; }
  h2 { font-size: 14px; font-weight: 600; color: #636e7b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
  .post { background: #ffffff; border: 1px solid #d0d7de; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .post-header { padding: 14px 16px; border-bottom: 1px solid #eaeef2; display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 12px; background: #ddf4ff; color: #0969da; border: 1px solid #54aeff66; }
  .post-id { font-size: 12px; color: #636e7b; margin-left: auto; }
  .score { font-size: 12px; color: #636e7b; margin-left: 8px; }
  .post-body { padding: 14px 16px; }
  .post-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: #1f2328; }
  .post-desc { font-size: 13px; color: #636e7b; line-height: 1.5; margin-bottom: 12px; }
  .post-media { font-size: 12px; color: #636e7b; margin-bottom: 4px; }
  .post-media a { color: #0969da; text-decoration: none; }
  .post-media a:hover { text-decoration: underline; }
  .media-box { width: 100%; height: 360px; border-radius: 6px; margin-bottom: 10px; overflow: hidden; background: #f6f8fa; position: relative; }
  .media-box.pdf-box { height: auto; overflow: visible; }
  .media-preview { width: 100%; height: 100%; object-fit: contain; display: block; cursor: pointer; }
  .media-pending { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 100%; border: 1.5px dashed #d0d7de; border-radius: 6px; font-size: 13px; color: #afb8c1; }
  .pdf-preview { width: 100%; height: 640px; border: 1px solid #d0d7de; border-radius: 6px; display: block; background: #f6f8fa; }
  .feedback { padding: 12px 16px; border-top: 1px solid #eaeef2; display: flex; align-items: center; gap: 8px; background: #f6f8fa; }
  .feedback span { font-size: 12px; color: #636e7b; margin-right: 4px; }
  .btn { padding: 5px 14px; font-size: 13px; font-weight: 500; border: 1px solid; border-radius: 6px; cursor: pointer; transition: all 0.15s; background: #ffffff; }
  .btn-win  { color: #1a7f37; border-color: #1a7f3766; }
  .btn-win:hover, .btn-win.active  { background: #dafbe1; border-color: #1a7f37; }
  .btn-tie  { color: #9a6700; border-color: #9a670066; }
  .btn-tie:hover, .btn-tie.active  { background: #fff8c5; border-color: #9a6700; }
  .btn-lost { color: #cf222e; border-color: #cf222e66; }
  .btn-lost:hover, .btn-lost.active { background: #ffebe9; border-color: #cf222e; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { font-size: 12px; margin-left: 8px; color: #636e7b; min-width: 120px; }
  .btn-copy { margin-left: auto; padding: 5px 8px; background: transparent; border: 1px solid #d0d7de; border-radius: 6px; color: #636e7b; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 12px; transition: all 0.15s; }
  .btn-copy:hover { background: #f6f8fa; border-color: #0969da; color: #0969da; }
  .btn-copy.copied { color: #1a7f37; border-color: #1a7f37; background: #dafbe1; }
  .status.ok   { color: #1a7f37; }
  .status.err  { color: #cf222e; }
  .loading { text-align: center; padding: 48px; color: #636e7b; }
  .mentions { font-size: 12px; color: #0969da; margin-top: 8px; margin-bottom: 4px; font-weight: 500; }
  .mentions-label { font-size: 11px; color: #636e7b; margin-right: 4px; font-weight: 400; }
  .hashtags { font-size: 11px; color: #0969da; margin-bottom: 12px; }
</style>
</head>
<body>

<header>
  <img src="logo.jpg" alt="Red Wolf">
  <h1>Weekly Content Review</h1>
  <span id="week-label"></span>
</header>

<main>
  <h2>Posts for approval</h2>
  <div id="posts"><p class="loading">Loading posts…</p></div>
</main>

<script>
const OWNER  = "jayreck996";
const REPO   = "md-redwolf";
const TOKEN  = "__REVIEW_PAT__".startsWith("__") ? (window.__MD_REDWOLF__ || "") : "__REVIEW_PAT__";
const CSV_URL = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/SHOULD/TABLE-2026Q3.csv`;

function parseCSV(text) {
  const lines = text.trim().replace(/\r/g, "").split("\n");
  const headers = lines[0].replace(/"/g, "").split(",");
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = "", inQ = false;
    for (const ch of line) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { vals.push(cur); cur = ""; }
      else { cur += ch; }
    }
    vals.push(cur);
    return Object.fromEntries(headers.map((h, i) => [h, (vals[i] || "").trim()]));
  });
}

function mediaLink(row) {
  const url = row["media URL"];
  const label = row["media"] || "View media";
  if (!url) return "";
  if (/\.(md)$/i.test(url)) return `<div class="media-box"><div class="media-pending"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 2.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25ZM0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25ZM8 5.5a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5Zm-2 3.5 1.5 1.5 2-2 2.5 2.5H4Z"/></svg>Media pending</div></div>`;
  if (/\.(png|jpe?g|gif|webp|svg)$/i.test(url)) {
    return `<div class="media-box"><a href="${url}" target="_blank"><img class="media-preview" src="${url}" alt="${label}" loading="lazy"></a></div>
            <div class="post-media"><a href="${url}" target="_blank">${label}</a></div>`;
  }
  if (/\.pdf$/i.test(url)) {
    const viewer = `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;
    return `<div class="media-box pdf-box"><iframe class="pdf-preview" src="${viewer}" title="${label}"></iframe></div>
            <div class="post-media"><a href="${url}" target="_blank">${label}</a></div>`;
  }
  return `<div class="post-media"><a href="${url}" target="_blank">${label}</a></div>`;
}

async function submitFeedback(postId, result, btn, statusEl, allBtns) {
  allBtns.forEach(b => { b.disabled = true; b.style.opacity = ""; });
  statusEl.textContent = "Submitting…";
  statusEl.className = "status";
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/dispatches`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${TOKEN}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        event_type: "client-feedback",
        client_payload: { post_id: postId, result: result }
      })
    });
    if (res.status === 204) {
      allBtns.forEach(b => { b.classList.remove("active"); b.style.opacity = b.dataset.result !== result ? "0.35" : ""; });
      btn.classList.add("active");
      statusEl.textContent = `Saved: ${result}`;
      statusEl.className = "status ok";
      allBtns.forEach(b => b.disabled = false);
    } else {
      throw new Error(`HTTP ${res.status}`);
    }
  } catch (e) {
    statusEl.textContent = `Error: ${e.message}`;
    statusEl.className = "status err";
    allBtns.forEach(b => { b.disabled = false; b.style.opacity = ""; });
  }
}

async function load() {
  const res = await fetch(CSV_URL + "?t=" + Date.now());
  const text = await res.text();
  const rows = parseCSV(text);

  const weeks = [...new Set(rows.map(r => r.week))];
  document.getElementById("week-label").textContent = `Week ${weeks.join(", ")}`;

  const container = document.getElementById("posts");
  container.innerHTML = "";

  rows.forEach(row => {
    const feedback = row["feedback"] || "";
    const div = document.createElement("div");
    div.className = "post";
    div.innerHTML = `
      <div class="post-header">
        <span class="badge">${row.topic}</span>
        <span class="badge">${row.type}</span>
        <span class="post-id">${row.item}</span>
        <span class="score">Score: ${row.score}</span>
      </div>
      <div class="post-body">
        <div class="post-title">${row.title}</div>
        <div class="post-desc">${row.description}</div>
        ${row["linkedin account tag"] ? `<div class="mentions"><span class="mentions-label">Tag:</span>${row["linkedin account tag"]}</div>` : ""}
        <div class="hashtags">${row.hashtag}</div>
        ${mediaLink(row)}
      </div>
      <div class="feedback">
        <span>Feedback:</span>
        <button class="btn btn-win ${feedback==='win'?'active':''}"  data-result="win">Win</button>
        <button class="btn btn-tie ${feedback==='tie'?'active':''}"  data-result="tie">Tie</button>
        <button class="btn btn-lost ${feedback==='lost'?'active':''}" data-result="lost">Lost</button>
        <span class="status">${feedback ? 'Saved: '+feedback : ''}</span>
        <button class="btn-copy" title="Copy post content">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>
          Copy
        </button>
      </div>`;

    const btns = [...div.querySelectorAll(".btn")];
    const statusEl = div.querySelector(".status");
    btns.forEach(btn => {
      btn.addEventListener("click", () =>
        submitFeedback(row.item, btn.dataset.result, btn, statusEl, btns)
      );
    });
    if (feedback) {
      btns.forEach(b => {
        if (b.dataset.result !== feedback) b.style.opacity = "0.35";
      });
    }

    const copyBtn = div.querySelector(".btn-copy");
    copyBtn.addEventListener("click", () => {
      const text = [row.title, "", row.description, "", row["linkedin account tag"], row.hashtag].filter(Boolean).join("\n");
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.classList.add("copied");
        copyBtn.querySelector("svg + text, span") ;
        const orig = copyBtn.innerHTML;
        copyBtn.innerHTML = copyBtn.innerHTML.replace("Copy", "Copied!");
        setTimeout(() => { copyBtn.innerHTML = orig; copyBtn.classList.remove("copied"); }, 2000);
      });
    });

    container.appendChild(div);
  });
}

load().catch(e => {
  document.getElementById("posts").innerHTML = `<p class="loading" style="color:#f85149">Failed to load: ${e.message}</p>`;
});
</script>
</body>
</html>
