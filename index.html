<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Wolf — Weekly Content Review</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f8fa; color: #1f2328; min-height: 100vh; }
  header { background: #ffffff; border-bottom: 1px solid #d0d7de; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header img { height: 36px; border-radius: 4px; }
  header h1 { font-size: 18px; font-weight: 600; color: #1f2328; }
  header span { font-size: 13px; color: #636e7b; margin-left: auto; }
  main { max-width: 860px; margin: 32px auto; padding: 0 16px; }
  h2 { font-size: 14px; font-weight: 600; color: #636e7b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 16px; }
  .post { background: #ffffff; border: 1px solid #d0d7de; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
  .post-header { padding: 14px 16px; border-bottom: 1px solid #eaeef2; display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 12px; background: #ddf4ff; color: #0969da; border: 1px solid #54aeff66; }
  .post-id { font-size: 12px; color: #636e7b; margin-left: auto; }
  .score { font-size: 12px; color: #636e7b; margin-left: 8px; }
  .post-body { padding: 14px 16px; }
  .post-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: #1f2328; }
  .post-desc { font-size: 13px; color: #636e7b; line-height: 1.5; margin-bottom: 12px; }
  .post-media { font-size: 12px; color: #636e7b; margin-bottom: 4px; }
  .post-media a { color: #0969da; text-decoration: none; }
  .post-media a:hover { text-decoration: underline; }
  .media-preview { width: 100%; height: auto; border-radius: 6px; margin-bottom: 10px; display: block; cursor: pointer; }
  .media-pending { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 220px; border: 1.5px dashed #d0d7de; border-radius: 6px; margin-bottom: 10px; background: #f6f8fa; font-size: 13px; color: #afb8c1; }
  .pdf-preview { width: 100%; height: 600px; border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 10px; display: block; background: #f6f8fa; }
  .feedback { padding: 12px 16px; border-top: 1px solid #eaeef2; display: flex; align-items: center; gap: 8px; background: #f6f8fa; }
  .feedback span { font-size: 12px; color: #636e7b; margin-right: 4px; }
  .btn { padding: 5px 14px; font-size: 13px; font-weight: 500; border: 1px solid; border-radius: 6px; cursor: pointer; transition: all 0.15s; background: #ffffff; }
  .btn-win  { color: #1a7f37; border-color: #1a7f3766; }
  .btn-win:hover, .btn-win.active  { background: #dafbe1; border-color: #1a7f37; }
  .btn-tie  { color: #9a6700; border-color: #9a670066; }
  .btn-tie:hover, .btn-tie.active  { background: #fff8c5; border-color: #9a6700; }
  .btn-lost { color: #cf222e; border-color: #cf222e66; }
  .btn-lost:hover, .btn-lost.active { background: #ffebe9; border-color: #cf222e; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { font-size: 12px; margin-left: 8px; color: #636e7b; min-width: 120px; }
  .status.ok   { color: #1a7f37; }
  .status.err  { color: #cf222e; }
  .loading { text-align: center; padding: 48px; color: #636e7b; }
  .hashtags { font-size: 11px; color: #0969da; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <img src="logo.jpg" alt="Red Wolf">
  <h1>Weekly Content Review</h1>
  <span id="week-label"></span>
</header>

<main>
  <h2>Posts for approval</h2>
  <div id="posts"><p class="loading">Loading posts…</p></div>
</main>

<script>
const OWNER  = "jayreck996";
const REPO   = "md-redwolf";
const TOKEN  = "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";
const CSV_URL = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/SHOULD/TABLE-2026Q3.csv`;

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].replace(/"/g, "").split(",");
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = "", inQ = false;
    for (const ch of line) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { vals.push(cur); cur = ""; }
      else { cur += ch; }
    }
    vals.push(cur);
    return Object.fromEntries(headers.map((h, i) => [h, (vals[i] || "").trim()]));
  });
}

function mediaLink(row) {
  const url = row["media URL"];
  const label = row["media"] || "View media";
  if (!url) return "";
  if (/\.(md)$/i.test(url)) return `<div class="media-pending"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M1.75 2.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25ZM0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25ZM8 5.5a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5Zm-2 3.5 1.5 1.5 2-2 2.5 2.5H4Z"/></svg>Media pending</div>`;
  if (/\.(png|jpe?g|gif|webp|svg)$/i.test(url)) {
    return `<a href="${url}" target="_blank"><img class="media-preview" src="${url}" alt="${label}" loading="lazy"></a>
            <div class="post-media"><a href="${url}" target="_blank">${label}</a></div>`;
  }
  if (/\.pdf$/i.test(url)) {
    const viewer = `https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true`;
    return `<iframe class="pdf-preview" src="${viewer}" title="${label}"></iframe>
            <div class="post-media"><a href="${url}" target="_blank">${label}</a></div>`;
  }
  return `<div class="post-media"><a href="${url}" target="_blank">${label}</a></div>`;
}

async function submitFeedback(postId, result, btn, statusEl, allBtns) {
  allBtns.forEach(b => b.disabled = true);
  statusEl.textContent = "Submitting…";
  statusEl.className = "status";
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/dispatches`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${TOKEN}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        event_type: "client-feedback",
        client_payload: { post_id: postId, result: result }
      })
    });
    if (res.status === 204) {
      btn.classList.add("active");
      statusEl.textContent = `Saved: ${result}`;
      statusEl.className = "status ok";
    } else {
      throw new Error(`HTTP ${res.status}`);
    }
  } catch (e) {
    statusEl.textContent = `Error: ${e.message}`;
    statusEl.className = "status err";
    allBtns.forEach(b => b.disabled = false);
  }
}

async function load() {
  const res = await fetch(CSV_URL + "?t=" + Date.now());
  const text = await res.text();
  const rows = parseCSV(text);

  const weeks = [...new Set(rows.map(r => r.week))];
  document.getElementById("week-label").textContent = `Week ${weeks.join(", ")}`;

  const container = document.getElementById("posts");
  container.innerHTML = "";

  rows.forEach(row => {
    const feedback = row["feedback"] || "";
    const div = document.createElement("div");
    div.className = "post";
    div.innerHTML = `
      <div class="post-header">
        <span class="badge">${row.topic}</span>
        <span class="badge">${row.type}</span>
        <span class="post-id">${row.item}</span>
        <span class="score">Score: ${row.score}</span>
      </div>
      <div class="post-body">
        <div class="post-title">${row.title}</div>
        <div class="post-desc">${row.description}</div>
        ${mediaLink(row)}
        <div class="hashtags">${row.hashtag}</div>
      </div>
      <div class="feedback">
        <span>Feedback:</span>
        <button class="btn btn-win ${feedback==='win'?'active':''}"  data-result="win">Win</button>
        <button class="btn btn-tie ${feedback==='tie'?'active':''}"  data-result="tie">Tie</button>
        <button class="btn btn-lost ${feedback==='lost'?'active':''}" data-result="lost">Lost</button>
        <span class="status">${feedback ? 'Saved: '+feedback : ''}</span>
      </div>`;

    const btns = [...div.querySelectorAll(".btn")];
    const statusEl = div.querySelector(".status");
    btns.forEach(btn => {
      btn.addEventListener("click", () =>
        submitFeedback(row.item, btn.dataset.result, btn, statusEl, btns)
      );
    });
    if (feedback) btns.forEach(b => b.disabled = true);

    container.appendChild(div);
  });
}

load().catch(e => {
  document.getElementById("posts").innerHTML = `<p class="loading" style="color:#f85149">Failed to load: ${e.message}</p>`;
});
</script>
</body>
</html>
