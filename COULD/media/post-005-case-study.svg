<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">

  <!-- Background -->
  <rect width="1080" height="1080" fill="#F5F5F5"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="1080" height="130" fill="#CC1111"/>
  <text x="540" y="52" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="32" fill="white" text-anchor="middle" letter-spacing="4">RED WOLF HIGH LEVEL SECURITY</text>
  <text x="540" y="88" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="2">CASE STUDY — WELLINGTON</text>
  <rect x="440" y="105" width="200" height="3" fill="rgba(255,255,255,0.3)" rx="2"/>

  <!-- Case study label -->
  <rect x="60" y="160" width="160" height="36" fill="#1A1A1A" rx="4"/>
  <text x="140" y="184" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" letter-spacing="2">CASE STUDY</text>

  <!-- Title -->
  <text x="60" y="250" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="44" fill="#1A1A1A">HOW WE SECURED</text>
  <text x="60" y="305" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="44" fill="#1A1A1A">A MULTI-SITE RETAIL</text>
  <text x="60" y="360" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="44" fill="#CC1111">GROUP ACROSS</text>
  <text x="60" y="415" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="44" fill="#CC1111">WELLINGTON</text>

  <!-- Divider -->
  <rect x="60" y="440" width="960" height="2" fill="#DDD"/>

  <!-- Challenge block -->
  <text x="60" y="480" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#CC1111" letter-spacing="2">THE CHALLENGE</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="18" fill="#444">A Wellington retail group needed unified visibility and</text>
  <text x="60" y="536" font-family="Arial, sans-serif" font-size="18" fill="#444">access control across multiple sites — with no central</text>
  <text x="60" y="562" font-family="Arial, sans-serif" font-size="18" fill="#444">oversight and inconsistent legacy equipment.</text>

  <!-- Stats row -->
  <rect x="60" y="600" width="960" height="200" fill="white" rx="10" filter="url(#shadow)"/>

  <!-- Stat 1 -->
  <text x="230" y="670" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#CC1111" text-anchor="middle">6</text>
  <text x="230" y="708" font-family="Arial, sans-serif" font-size="16" fill="#888" text-anchor="middle" letter-spacing="1">SITES SECURED</text>

  <!-- Divider -->
  <rect x="387" y="625" width="2" height="150" fill="#EEE"/>

  <!-- Stat 2 -->
  <text x="540" y="670" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#CC1111" text-anchor="middle">24/7</text>
  <text x="540" y="708" font-family="Arial, sans-serif" font-size="16" fill="#888" text-anchor="middle" letter-spacing="1">LIVE MONITORING</text>

  <!-- Divider -->
  <rect x="693" y="625" width="2" height="150" fill="#EEE"/>

  <!-- Stat 3 -->
  <text x="870" y="670" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#CC1111" text-anchor="middle">1</text>
  <text x="870" y="708" font-family="Arial, sans-serif" font-size="16" fill="#888" text-anchor="middle" letter-spacing="1">UNIFIED SYSTEM</text>

  <!-- Stat sub-labels -->
  <text x="230" y="755" font-family="Arial, sans-serif" font-size="13" fill="#BBB" text-anchor="middle">CCTV + Access Control</text>
  <text x="540" y="755" font-family="Arial, sans-serif" font-size="13" fill="#BBB" text-anchor="middle">NOC-backed response</text>
  <text x="870" y="755" font-family="Arial, sans-serif" font-size="13" fill="#BBB" text-anchor="middle">Centralised dashboard</text>

  <!-- Quote / outcome -->
  <rect x="60" y="830" width="6" height="100" fill="#CC1111" rx="3"/>
  <text x="90" y="870" font-family="Arial, sans-serif" font-style="italic" font-size="20" fill="#333">Complete visibility across every site,</text>
  <text x="90" y="900" font-family="Arial, sans-serif" font-style="italic" font-size="20" fill="#333">managed from a single interface.</text>

  <!-- Footer -->
  <rect x="0" y="1010" width="1080" height="70" fill="#1A1A1A"/>
  <text x="540" y="1052" font-family="Arial, sans-serif" font-size="15" fill="#888" text-anchor="middle">redwolf.net.nz  |  Wellington &amp; Auckland  |  ISO 9001 Certified  |  NZSA Accredited</text>
</svg>
