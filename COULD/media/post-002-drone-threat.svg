<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#CC1111"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#1A1A1A"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="1080" height="110" fill="#CC1111"/>
  <text x="540" y="52" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="32" fill="white" text-anchor="middle" letter-spacing="4">RED WOLF HIGH LEVEL SECURITY</text>
  <text x="540" y="88" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="2">SECURITY INTELLIGENCE BRIEF</text>

  <!-- Main title -->
  <text x="540" y="175" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" fill="white" text-anchor="middle">DRONE THREATS</text>
  <text x="540" y="232" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="36" fill="#CC1111" text-anchor="middle">ARE NOW A REAL SECURITY GAP</text>
  <text x="540" y="272" font-family="Arial, sans-serif" font-size="18" fill="#888" text-anchor="middle">What NZ businesses need to know — and do — right now.</text>

  <!-- Facility box (top-down) -->
  <rect x="390" y="310" width="300" height="200" fill="#2A2A2A" stroke="#444" stroke-width="2" rx="6"/>
  <rect x="410" y="330" width="60" height="50" fill="#333" rx="3"/>
  <rect x="490" y="330" width="60" height="50" fill="#333" rx="3"/>
  <rect x="570" y="330" width="60" height="50" fill="#333" rx="3"/>
  <rect x="410" y="400" width="220" height="90" fill="#333" rx="3"/>
  <text x="540" y="452" font-family="Arial, sans-serif" font-size="15" fill="#666" text-anchor="middle" letter-spacing="2">YOUR FACILITY</text>

  <!-- Perimeter rings -->
  <ellipse cx="540" cy="410" rx="230" ry="190" fill="none" stroke="#CC1111" stroke-width="1.5" stroke-dasharray="10,5" opacity="0.3"/>
  <ellipse cx="540" cy="410" rx="310" ry="260" fill="none" stroke="#CC1111" stroke-width="1" stroke-dasharray="10,5" opacity="0.15"/>

  <!-- Drone 1 — top right approach -->
  <!-- Drone body -->
  <g transform="translate(790, 215) rotate(225)">
    <rect x="-10" y="-5" width="20" height="10" fill="#CC1111" rx="3"/>
    <line x1="-18" y1="-18" x2="-10" y2="-5" stroke="#CC1111" stroke-width="2"/>
    <line x1="18" y1="-18" x2="10" y2="-5" stroke="#CC1111" stroke-width="2"/>
    <line x1="-18" y1="18" x2="-10" y2="5" stroke="#CC1111" stroke-width="2"/>
    <line x1="18" y1="18" x2="10" y2="5" stroke="#CC1111" stroke-width="2"/>
    <circle cx="-18" cy="-18" r="7" fill="none" stroke="#CC1111" stroke-width="2"/>
    <circle cx="18" cy="-18" r="7" fill="none" stroke="#CC1111" stroke-width="2"/>
    <circle cx="-18" cy="18" r="7" fill="none" stroke="#CC1111" stroke-width="2"/>
    <circle cx="18" cy="18" r="7" fill="none" stroke="#CC1111" stroke-width="2"/>
  </g>
  <line x1="766" y1="240" x2="660" y2="330" stroke="#CC1111" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>

  <!-- Drone 2 — left approach -->
  <g transform="translate(200, 400) rotate(90)">
    <rect x="-10" y="-5" width="20" height="10" fill="#CC1111" rx="3"/>
    <line x1="-18" y1="-18" x2="-10" y2="-5" stroke="#CC1111" stroke-width="2"/>
    <line x1="18" y1="-18" x2="10" y2="-5" stroke="#CC1111" stroke-width="2"/>
    <line x1="-18" y1="18" x2="-10" y2="5" stroke="#CC1111" stroke-width="2"/>
    <line x1="18" y1="18" x2="10" y2="5" stroke="#CC1111" stroke-width="2"/>
    <circle cx="-18" cy="-18" r="7" fill="none" stroke="#CC1111" stroke-width="2"/>
    <circle cx="18" cy="-18" r="7" fill="none" stroke="#CC1111" stroke-width="2"/>
    <circle cx="-18" cy="18" r="7" fill="none" stroke="#CC1111" stroke-width="2"/>
    <circle cx="18" cy="18" r="7" fill="none" stroke="#CC1111" stroke-width="2"/>
  </g>
  <line x1="240" y1="400" x2="388" y2="400" stroke="#CC1111" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>

  <!-- Drone 3 — bottom approach -->
  <g transform="translate(540, 720) rotate(0)">
    <rect x="-10" y="-5" width="20" height="10" fill="#CC1111" rx="3"/>
    <line x1="-18" y1="-18" x2="-10" y2="-5" stroke="#CC1111" stroke-width="2"/>
    <line x1="18" y1="-18" x2="10" y2="-5" stroke="#CC1111" stroke-width="2"/>
    <line x1="-18" y1="18" x2="-10" y2="5" stroke="#CC1111" stroke-width="2"/>
    <line x1="18" y1="18" x2="10" y2="5" stroke="#CC1111" stroke-width="2"/>
    <circle cx="-18" cy="-18" r="7" fill="none" stroke="#CC1111" stroke-width="2"/>
    <circle cx="18" cy="-18" r="7" fill="none" stroke="#CC1111" stroke-width="2"/>
    <circle cx="-18" cy="18" r="7" fill="none" stroke="#CC1111" stroke-width="2"/>
    <circle cx="18" cy="18" r="7" fill="none" stroke="#CC1111" stroke-width="2"/>
  </g>
  <line x1="540" y1="700" x2="540" y2="515" stroke="#CC1111" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>

  <!-- 3 threat cards -->
  <rect x="60" y="760" width="300" height="155" fill="#222" rx="8"/>
  <rect x="60" y="760" width="300" height="6" fill="#CC1111" rx="3"/>
  <text x="210" y="800" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="16" fill="#CC1111" text-anchor="middle" letter-spacing="1">AERIAL SURVEILLANCE</text>
  <text x="210" y="828" font-family="Arial, sans-serif" font-size="14" fill="#AAA" text-anchor="middle">Traditional CCTV has</text>
  <text x="210" y="848" font-family="Arial, sans-serif" font-size="14" fill="#AAA" text-anchor="middle">no upward field of view.</text>
  <text x="210" y="875" font-family="Arial, sans-serif" font-size="14" fill="#AAA" text-anchor="middle">Drones map your site</text>
  <text x="210" y="895" font-family="Arial, sans-serif" font-size="14" fill="#AAA" text-anchor="middle">before you even notice.</text>

  <rect x="390" y="760" width="300" height="155" fill="#222" rx="8"/>
  <rect x="390" y="760" width="300" height="6" fill="#CC1111" rx="3"/>
  <text x="540" y="800" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="16" fill="#CC1111" text-anchor="middle" letter-spacing="1">PERIMETER BYPASS</text>
  <text x="540" y="828" font-family="Arial, sans-serif" font-size="14" fill="#AAA" text-anchor="middle">Fences, gates, and guards</text>
  <text x="540" y="848" font-family="Arial, sans-serif" font-size="14" fill="#AAA" text-anchor="middle">are designed for ground.</text>
  <text x="540" y="875" font-family="Arial, sans-serif" font-size="14" fill="#AAA" text-anchor="middle">A drone bypasses all of</text>
  <text x="540" y="895" font-family="Arial, sans-serif" font-size="14" fill="#AAA" text-anchor="middle">them in seconds.</text>

  <rect x="720" y="760" width="300" height="155" fill="#222" rx="8"/>
  <rect x="720" y="760" width="300" height="6" fill="#CC1111" rx="3"/>
  <text x="870" y="800" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="16" fill="#CC1111" text-anchor="middle" letter-spacing="1">SOLUTIONS EXIST</text>
  <text x="870" y="828" font-family="Arial, sans-serif" font-size="14" fill="#AAA" text-anchor="middle">Counter-drone detection,</text>
  <text x="870" y="848" font-family="Arial, sans-serif" font-size="14" fill="#AAA" text-anchor="middle">RF monitoring, and</text>
  <text x="870" y="875" font-family="Arial, sans-serif" font-size="14" fill="#AAA" text-anchor="middle">integrated alert systems</text>
  <text x="870" y="895" font-family="Arial, sans-serif" font-size="14" fill="#AAA" text-anchor="middle">are available now.</text>

  <!-- Footer -->
  <text x="540" y="955" font-family="Arial, sans-serif" font-size="15" fill="#555" text-anchor="middle">Is your facility protected from above?  |  redwolf.net.nz  |  Wellington &amp; Auckland</text>
</svg>
